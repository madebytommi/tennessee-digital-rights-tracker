name: Gemini safe tracker fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: gemini-safe-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  safe-fix:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tracker validator and capture output
        id: validator
        shell: bash
        run: |
          set +e
          python scripts/validate_entries.py > validator.log 2>&1
          code=$?
          cat validator.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check Gemini configuration
        if: steps.validator.outputs.exit_code != '0'
        id: gemini
        shell: bash
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GEMINI_API_KEY is not configured; leaving validation repair for human review."
          fi

      - name: Install Gemini safe-fix dependencies
        if: >-
          steps.validator.outputs.exit_code != '0' &&
          steps.gemini.outputs.configured == 'true'
        run: python -m pip install google-genai requests

      - name: Ask Gemini to classify and repair allowlisted structural failures
        if: >-
          steps.validator.outputs.exit_code != '0' &&
          steps.gemini.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python scripts/gemini_safe_fix.py validator.log
