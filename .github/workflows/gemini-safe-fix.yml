name: Gemini safe tracker fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: gemini-safe-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  safe-fix:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install validation and Gemini dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install google-genai requests

      - name: Run tracker validator and capture output
        id: validator
        shell: bash
        run: |
          set +e
          python scripts/validate_entries.py > validator.log 2>&1
          code=$?
          cat validator.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Ask Gemini to classify and repair allowlisted structural failures
        if: steps.validator.outputs.exit_code != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python scripts/gemini_safe_fix.py validator.log
