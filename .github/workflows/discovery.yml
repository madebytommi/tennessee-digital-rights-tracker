name: Tennessee Rights Scout

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Collect and score leads without creating GitHub issues or writing seen.json
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "15 13 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: tennessee-rights-scout
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out Scout state
        uses: actions/checkout@v4
        with:
          ref: scout-state
          path: .scout-state
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r discovery/requirements.txt

      - name: Run scout unit tests
        run: python3 -m unittest discover -s discovery/tests -t .

      - name: Load Scout seen state
        run: |
          set -euo pipefail
          state_src=".scout-state/discovery-data/seen.json"
          if [ ! -f "$state_src" ]; then
            echo "::error::Missing Scout state file ${state_src} on branch scout-state. Live runs cannot continue with empty state."
            exit 1
          fi
          python3 - "$state_src" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          try:
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
          except (OSError, json.JSONDecodeError) as exc:
              print(
                  f"::error::Corrupt Scout state file {path}: {exc}",
                  file=sys.stderr,
              )
              sys.exit(1)
          if not isinstance(payload, dict) or "items" not in payload:
              print(
                  f"::error::Scout state file {path} is malformed; expected an object with an 'items' key.",
                  file=sys.stderr,
              )
              sys.exit(1)
          items = payload.get("items") or {}
          print(f"Loaded Scout state with {len(items)} recorded item(s).")
          PY
          mkdir -p discovery-data
          cp "$state_src" discovery-data/seen.json

      - name: Run Tennessee Rights Scout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cmd=(python3 -m discovery.discover)
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            cmd+=(--dry-run)
          fi
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY is not configured; running collection only."
            cmd+=(--skip-gemini)
          fi
          "${cmd[@]}"

      - name: Persist discovery state
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          if [ ! -f discovery-data/seen.json ]; then
            echo "::error::Scout did not produce discovery-data/seen.json; refusing to update scout-state."
            exit 1
          fi
          mkdir -p .scout-state/discovery-data
          cp discovery-data/seen.json .scout-state/discovery-data/seen.json
          cd .scout-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery-data/seen.json
          if git diff --cached --quiet; then
            echo "No discovery state change to persist."
            exit 0
          fi
          git commit -m "chore: update Tennessee Rights Scout seen state"
          git push origin HEAD:scout-state
