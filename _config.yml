title: Tennessee Digital Rights Tracker
description: Clear, source-linked explanations of how Tennessee laws, government technologies, and civic-information systems affect privacy, identity, personal data, and civil rights.
url: "https://madebytommi.github.io"
baseurl: "/tennessee-digital-rights-tracker"
repository_url: "https://github.com/madebytommi/tennessee-digital-rights-tracker"
markdown: kramdown
permalink: pretty

collections:
  entries:
    output: true
    permalink: /entries/:name/
  special_cases:
    output: true
    permalink: /special-cases/:name/

defaults:
  - scope:
      path: ""
      type: entries
    values:
      layout: entry
  - scope:
      path: ""
      type: special_cases
    values:
      layout: special-case

exclude:
  - research
  - discovery
  - discovery-data
  - scripts
  - schemas
  - templates
  - requirements-dev.txt
  - README.md
  - CONTRIBUTING.md
  - SECURITY.md
  - LICENSE
  - LICENSE-CONTENT.md
